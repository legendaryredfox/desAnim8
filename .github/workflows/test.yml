name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit lua5.1 lua5.4
      - name: Build Lua 5.5
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.5.0.tar.gz -o lua55.tar.gz
          tar xzf lua55.tar.gz
          make -C lua-5.5.0 linux -j2
          sudo make -C lua-5.5.0 install
      - run: luajit tests/run.lua
      - run: lua5.1 tests/run.lua
      - run: lua5.4 tests/run.lua
      - run: lua tests/run.lua
      - run: luajit tests/bench.lua
      - name: Single-file build is current and passes
        run: |
          lua tools/bundle.lua --check
          DESANIM8_BUNDLE=dist/desAnim8.lua luajit tests/run.lua
          DESANIM8_BUNDLE=dist/desAnim8.lua lua5.1 tests/run.lua
          DESANIM8_BUNDLE=dist/desAnim8.lua lua5.4 tests/run.lua
          DESANIM8_BUNDLE=dist/desAnim8.lua lua tests/run.lua

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luarocks lua5.4 liblua5.4-dev
      - run: sudo luarocks install luacheck
      - run: luacheck desAnim8.lua desAnim8 tests tools

  rockspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luarocks lua5.4 liblua5.4-dev
      - run: luarocks --local make desanim8-0.10.0-1.rockspec

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y love xvfb
      - run: xvfb-run -a love tests/smoke
